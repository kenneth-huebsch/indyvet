services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vetic
      POSTGRES_PASSWORD: vetic-dev
      POSTGRES_DB: vetic
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vetic -d vetic']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
